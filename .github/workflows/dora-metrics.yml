name: Métricas DORA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  dora:
    runs-on: windows-latest

    steps:
      - name: Test Deployment Frequency
        uses: DeveloperMetrics/deployment-frequency@main
        with:
          workflows: 'Métricas DORA'
          actions-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Lead Time
        uses: DeveloperMetrics/lead-time-for-changes@main
        with:
          workflows: 'Métricas DORA'
          actions-token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # CHANGE FAILURE RATE (CFR)
      # -----------------------------
      - name: Calculate CFR
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }

          $url = "https://api.github.com/repos/itstherall/PS-Project/actions/runs?per_page=100"

          $response = Invoke-RestMethod -Uri $url -Headers $headers
          $runs = $response.workflow_runs

          if (-not $runs) {
            Write-Host "No workflow runs found"
            exit 0
          }

          # Filtra apenas main + push
          $filtered = $runs | Where-Object {
            $_.head_branch -eq "main" -and $_.event -eq "push"
          }

          $total = $filtered.Count

          $failed = ($filtered | Where-Object {
            $_.conclusion -eq "failure"
          }).Count

          if ($total -gt 0) {
            $cfr = ($failed / $total) * 100

            Add-Content $env:GITHUB_STEP_SUMMARY "## Change Failure Rate"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "- Total Deploys: $total"
            Add-Content $env:GITHUB_STEP_SUMMARY "- Failed Deploys: $failed"
            Add-Content $env:GITHUB_STEP_SUMMARY ("- CFR: {0:N2}%" -f $cfr)
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY "## Change Failure Rate"
            Add-Content $env:GITHUB_STEP_SUMMARY "- No deploys found"
          }

      # -----------------------------
      # MTTR
      # -----------------------------
      - name: Calculate MTTR
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }

          $url = "https://api.github.com/repos/itstherall/PS-Project/actions/runs?per_page=100"

          $response = Invoke-RestMethod -Uri $url -Headers $headers
          $runs = $response.workflow_runs

          if (-not $runs) {
            Write-Host "No workflow runs found"
            exit 0
          }

          # Filtra workflow correto + main
          $runs = $runs |
            Where-Object {
              $_.name -eq "Métricas DORA" -and $_.head_branch -eq "main"
            } |
            Sort-Object run_number

          $recoveryTimes = @()

          for ($i = 0; $i -lt $runs.Count; $i++) {

            if ($runs[$i].conclusion -eq "failure") {

              for ($j = $i + 1; $j -lt $runs.Count; $j++) {

                if ($runs[$j].conclusion -eq "success") {

                  $failureTime = Get-Date $runs[$i].updated_at
                  $successTime = Get-Date $runs[$j].updated_at

                  $recoveryHours = ($successTime - $failureTime).TotalHours
                  $recoveryTimes += $recoveryHours

                  break
                }
              }
            }
          }

          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "## Mean Time To Recovery"

          if ($recoveryTimes.Count -gt 0) {

            $mttr = ($recoveryTimes | Measure-Object -Average).Average

            Add-Content $env:GITHUB_STEP_SUMMARY "- Incidents: $($recoveryTimes.Count)"
            Add-Content $env:GITHUB_STEP_SUMMARY ("- MTTR: {0:N2} hours" -f $mttr)

          } else {

            Add-Content $env:GITHUB_STEP_SUMMARY "- No recoverable incidents found"
          }
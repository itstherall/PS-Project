<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login - Copylet</title>
	<link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<div class="body">
		<div class="login-container">
			<img src="images/running4.jpg" id="imgLogin" >
			<form action="/processar-login" method="POST">
			    <!-- Campo de E-mail ou Usuário -->
			    <div class="field">
			      <label for="email">E-mail:</label>
			      <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
			    </div>

			    <!-- Campo de Senha -->
			    <div class="field">
			      <label for="senha">Senha:</label>
			      <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
			    </div>
			    <!-- Link Auxiliar -->
			    <div class="auxilliary-links">
			      <a href="#" class="auxilliary-links">Esqueceu a senha?</a>
			    </div>
			    <!-- Botão de Envio -->
			    <button type="submit" id="buttonIn">Entrar</button>
			    
  			</form>
		</div>
	</div>
</body>
</html>

<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Home - Copylet</title>
		<link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
		<link rel="stylesheet" type="text/css" th:href="@{/css/home.css}">
	</head>
	<body>
		<div class="header">
			<div class="head-container container">
				<button type="button" class="headerButton">
					<img src="icons/bookmark stacks.png">
				</button>
				<form action="search.html" method="get" class="formPesquisa">
					<input type="search" name="q" placeholder="Pesquisar..." required>
					<button type="submit" class="headerButton">
						<img src="icons/search.png">
					</button>
				</form>
				<button type="button" class="headerButton">
					<img src="icons/add shopping cart.png">
				</button>
				
			</div>
		</div>
		<div class="banner">
			<img src="images/running4.jpg" alt="corredora sorrindo em movimento numa pista ao ar livre durante dia claro, cenário com céu e vegetação ao fundo, tom energico e inspirador">
			<label>Encontre as melhores fotos esportivas</label>
		</div>		
		<div class="main container">
			<div class="category container">
				<label>Categorias</label>
			</div>
			<div class="gallery" >
				<div class="category-card">
					<img src="images/basket.jpg" alt="jogador de basquete saltando para arremesso numa quadra interior com publico desfocado, acao atletica e concentracao no rosto"> <label>Basquete</label>
				</div>

				<div class="category-card">
					<img src="images/cycling.jpg" alt="ciclista em estrada de montanha inclinada usando capacete e roupa de ciclismo, movimento rapido e paisagem montanhosa ao fundo"> <label>Ciclismo</label>
				</div>
				
				<div class="category-card">
					<img src="images/football stadium.jpg" alt="vista panoramica de estadio de futebol com relvado iluminado e arquibancadas cheias durante jogo, atmosfera eletrica"> <label>Estádio de Futebol</label>
				</div>
				
				<div class="category-card">
					<img src="images/race track.jpg" alt="atletas correndo numa pista oval de atletismo durante competicao, movimentos rapidos e publico ao redor"> <label>Pista de Corrida</label>
				</div>
				
				<div class="category-card">
					<img src="images/running.jpg" alt="mulher correndo em rua urbana com postura concentrada e respiracao profunda, clima motivador"> <label>Corrida</label>
				</div>
				
				<div class="category-card">
					<img src="images/running2.jpg" alt="grupo de corredores amadores em trilha de parque com arvores, ambiente comunitario e energia positiva"> <label>Corrida</label>
				</div>
				
				<div class="category-card">
					<img src="images/snow board.jpg" alt="snowboarder deslizando por encosta nevada com montanhas e ceu claro ao fundo, acao radiante e clima aventureiro"> <label>Snow Board</label>
				</div>
				
				<div class="category-card">
					<img src="images/soccer ball.jpg" alt="bola de futebol no relvado com marcas da quadra visiveis, perspectiva proxima e luz natural"> <label>Bola de Futebol</label>
				</div>
				
				<div class="category-card">
					<img src="images/soccer field.jpg" alt="campo de futebol bem cuidado visto de angulo lateral com goleiras e arquibancada ao fundo, clima de dia ensolarado"> <label>Campo de Futebol</label>
				</div>
				
				<div class="category-card">
					<img src="images/swimming.jpg" alt="nadador em estilo livre numa piscina de competicao com raias, expressao de esforco e foco"> <label>Natação</label>
				</div>
				
				<div class="category-card">
					<img src="images/tennis.jpg" alt="jogador de tenis preparando-se para sacar numa quadra ao ar livre, raquete levantada e concentracao visivel"> <label>Tênis</label>
				</div>
				
				<div class="category-card">
					<img src="images/running3.jpg" alt="corredor de rua numa ponte urbana com horizonte da cidade ao fundo, sensacao de determinacao"> <label>Corrida</label>
				</div>
				
			</div>
		</div>
		<div class="footer container">
			<label>Uma nota, no rodapé.</label>
		</div>		
	</body>
</html>
